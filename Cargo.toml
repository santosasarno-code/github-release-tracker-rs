[package]
name = "github-release-tracker"
version = "2.3.0"
edition = "2021"

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
windows-sys = { version = "0.60", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Time",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole",
  "Win32_Networking_WinHttp", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
  "Win32_UI_HiDpi", "Win32_Storage_FileSystem", "Win32_System_Threading",
  "Win32_Globalization", "Win32_System_Diagnostics_Debug", "Win32_System_SystemInformation", "Win32_UI_Input",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lib]
name = "github_release_tracker"
path = "src/lib.rs"

[[bin]]
name = "github-release-tracker"
path = "src/main.rs"
